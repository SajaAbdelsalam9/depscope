[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depscope"
version = "0.1.0"
description = "Change-aware dependency vulnerability analyzer for Python projects"
requires-python = ">=3.10"
dependencies = ["requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
